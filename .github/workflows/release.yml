name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release
        run: pnpm verify
      - name: Prepare extension artifact
        run: pnpm package:extension
      - name: Prepare bridge artifact
        run: pnpm package:bridge
      - name: Prepare Firefox artifact
        run: pnpm package:firefox
      - name: Prepare Firefox for Android artifact
        run: pnpm package:firefox:android
      - name: Archive extension artifact
        run: tar -czf activityweaver-extension.tar.gz -C artifacts activityweaver-extension
      - name: Archive bridge artifact
        run: tar -czf activityweaver-bridge.tar.gz -C artifacts activityweaver-bridge
      - name: Archive Firefox artifact
        run: tar -czf activityweaver-firefox.tar.gz -C artifacts activityweaver-firefox
      - name: Archive Firefox for Android artifact
        run: tar -czf activityweaver-firefox-android.tar.gz -C artifacts activityweaver-firefox-android
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" activityweaver-extension.tar.gz activityweaver-bridge.tar.gz activityweaver-firefox.tar.gz activityweaver-firefox-android.tar.gz --generate-notes

  safari:
    needs: release
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build extension
        run: pnpm build:extension
      - name: Prepare Safari macOS project
        run: pnpm package:safari
      - name: Archive Safari macOS project
        run: tar -czf activityweaver-safari-macos.tar.gz -C artifacts activityweaver-safari
      - name: Prepare Safari iOS project
        env:
          SAFARI_PLATFORM: ios
        run: pnpm package:safari
      - name: Archive Safari iOS project
        run: tar -czf activityweaver-safari-ios.tar.gz -C artifacts activityweaver-safari
      - name: Upload Safari projects to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" activityweaver-safari-macos.tar.gz activityweaver-safari-ios.tar.gz
