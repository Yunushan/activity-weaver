name: Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release version
        run: node tools/check-release-version.mjs
      - name: Verify release
        run: pnpm verify
      - name: Prepare extension artifact
        run: pnpm package:extension
      - name: Prepare bridge artifact
        run: pnpm package:bridge
      - name: Prepare Firefox artifact
        run: pnpm package:firefox
      - name: Prepare Firefox for Android artifact
        run: pnpm package:firefox:android
      - name: Create release manifest
        run: node tools/create-release-manifest.mjs artifacts/activityweaver-extension.zip artifacts/activityweaver-bridge.zip artifacts/activityweaver-firefox.zip artifacts/activityweaver-firefox-android.zip
      - name: Verify release artifacts
        run: pnpm check:artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag artifacts/activityweaver-extension.zip artifacts/activityweaver-bridge.zip artifacts/activityweaver-firefox.zip artifacts/activityweaver-firefox-android.zip artifacts/release-manifest.json --generate-notes

  safari:
    needs: release
    runs-on: macos-latest
    timeout-minutes: 30
    environment: release
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace
        run: pnpm build
      - name: Prepare Safari macOS project
        run: pnpm package:safari
      - name: Archive Safari macOS project
        run: node tools/archive-directory.mjs artifacts/activityweaver-safari artifacts/activityweaver-safari-macos.zip
      - name: Prepare Safari iOS project
        env:
          SAFARI_PLATFORM: ios
        run: pnpm package:safari
      - name: Archive Safari iOS project
        run: node tools/archive-directory.mjs artifacts/activityweaver-safari artifacts/activityweaver-safari-ios.zip
      - name: Create Safari release manifest
        run: node tools/create-release-manifest.mjs artifacts/activityweaver-safari-macos.zip artifacts/activityweaver-safari-ios.zip
      - name: Rename Safari release manifest
        run: mv artifacts/release-manifest.json artifacts/activityweaver-safari-manifest.json
      - name: Upload Safari projects to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" artifacts/activityweaver-safari-macos.zip artifacts/activityweaver-safari-ios.zip artifacts/activityweaver-safari-manifest.json
